name: tests

# Runs the same suite a reader would run after cloning: syntax, the 85-case adversarial
# battery, the two hook matrices, and the leak sweep. Nothing here is CI-only, so a green
# check here means the command in the README works on a machine that is not mine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite checks out and runs tests. It writes nothing, opens no issue, publishes no
# package -- so GITHUB_TOKEN needs read access to the contents and nothing else. Without
# this block the token takes the ACCOUNT default, which is not visible from this file and
# can be widened elsewhere without anyone editing the workflow.
permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a SHA, not the v4 tag. A floating tag means whatever commit that tag
      # points at TODAY executes here -- the supply-chain hole this repository exists to
      # argue about. This SHA is what v4 resolved to on 2026-09-11, so pinning freezes
      # what was already running rather than changing it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: jq is a dependency of guard-find.sh
        run: jq --version

      - name: python3 version in use
        run: python3 --version

      - name: run the full suite
        run: ./tests/run-all.sh

      # A second pass for secret SHAPES rather than identities.
      #
      # The pattern is assembled from fragments rather than written out, because the first
      # draft of this step failed on itself: the sweep found the pattern line in this file
      # and reported a leak. That is the third time in one day that a check naming its own
      # targets became the thing it was looking for, and the repository documents the other
      # two. Splitting each token means this file contains no matchable string.
      - name: leak sweep for secret shapes
        run: |
          RE="ssh-""rsa|ssh-""ed25519|BEGIN [A-Z ]*PRIVATE ""KEY"
          RE="$RE|xox""[baprs]-|gh""p_|github""_pat_|AKIA""[0-9A-Z]{16}"
          GUARD_LEAK_RE="$RE" ./tests/run-all.sh
